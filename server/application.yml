# ============================================================
# 用户配置文件
# ============================================================

scorpion:
  # MySQL 配置（必填）
  mysql:
    url: jdbc:mysql://localhost:3306/scorpioncode?characterEncoding=utf-8&useSSL=false
    username: root
    password: 

  # Redis 配置（必填）
  redis:
    host: localhost
    port: 6379
    password:

  # 认证模式：jwt 或 cookie
  auth:
    mode: jwt
    cookie-secure: false # 仅 HTTPS 部署时置 true，http 下开启会导致浏览器拒收 cookie

  # 文件存储配置
  file:
    url: http://localhost:8800/resource/file/download/
    path: /home/upload

  # 阿里云 OSS 配置（可选）
  aliyun:
    endpoint: ""
    accessKeyId: ""
    accessKeySecret: ""
    bucketName: ""

  # Resend 邮件配置（可选）
  resend:
    api-key: ""
    from: ""